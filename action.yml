name: "Claude PR Review Gate"
description: "AI-powered PR review gatekeeper using Anthropic Claude with strict fail-closed security and prompt-injection defense."
author: "Marc Rambow (circularis.dev)"

branding:
  icon: "check-circle"
  color: "purple"

inputs:
  anthropic-api-key:
    description: "Anthropic API Key"
    required: true
  github-token:
    description: "GitHub Token for posting review comments"
    required: false
    default: "${{ github.token }}"
  base-ref:
    description: "Base branch ref to compare against (e.g. main, master)"
    required: false
    default: "${{ github.base_ref }}"
  diff-excludes:
    description: "Additional path patterns to exclude from git diff (one per line or space-separated, without shell quotes)"
    required: false
    default: |
      :!package-lock.json
      :!pnpm-lock.yaml
      :!yarn.lock
      :!*.min.*
      :!*.snap
      :!*.svg
      :!**/dist/**
  model:
    description: "Claude model to use for reviews"
    required: false
    default: "claude-sonnet-5-5"
  effort:
    description: "Reasoning effort (low, medium, high, xhigh, max). Not every model supports xhigh."
    required: false
    default: "medium"
  guidelines-file:
    description: "Path to guidelines markdown file (e.g. AGENTS.md)"
    required: false
    default: "AGENTS.md"
  max-diff-chars:
    description: "Maximum diff characters before truncation"
    required: false
    default: "400000"
  diff-context-lines:
    description: "Number of context lines around changes for git diff (-U<n>)"
    required: false
    default: "5"
  fail-on-truncated:
    description: "Whether to fail the review when the diff exceeds max-diff-chars and is truncated (default: false)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Python einrichten
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Abhängigkeiten installieren
      shell: bash
      run: pip install -r "${{ github.action_path }}/src/requirements.txt"

    - name: Git-Diff extrahieren
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        DIFF_EXCLUDES: ${{ inputs.diff-excludes }}
        DIFF_CONTEXT_LINES: ${{ inputs.diff-context-lines }}
      run: |
        excludes_args=()
        while IFS= read -r line || [ -n "$line" ]; do
          for item in $line; do
            # Anführungszeichen strippen, falls vom Caller versehentlich mitgegeben
            item="${item#\'}"
            item="${item%\'}"
            item="${item#\"}"
            item="${item%\"}"
            if [ -n "$item" ]; then
              excludes_args+=("$item")
            fi
          done
        done <<< "$DIFF_EXCLUDES"

        context_lines="${DIFF_CONTEXT_LINES:-5}"
        if ! [[ "$context_lines" =~ ^[0-9]+$ ]]; then
          context_lines=5
        fi

        # Dateiübersicht (--stat) für High-Level-Kontext
        git diff --stat "origin/${BASE_REF}...HEAD" -- . "${excludes_args[@]}" > pr_stat.txt
        echo "Geänderte Dateien (--stat):"
        cat pr_stat.txt

        # Git-Diff mit erweitertem Kontext
        git diff -U"$context_lines" "origin/${BASE_REF}...HEAD" -- . "${excludes_args[@]}" > pr_diff.txt
        echo "Diff-Größe: $(wc -c < pr_diff.txt) Bytes (Kontext: -U$context_lines)"

    - name: Claude Review ausführen
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        BASE_REF: ${{ inputs.base-ref }}
        REVIEW_MODEL: ${{ inputs.model }}
        REVIEW_EFFORT: ${{ inputs.effort }}
        GUIDELINES_FILE: ${{ inputs.guidelines-file }}
        MAX_DIFF_CHARS: ${{ inputs.max-diff-chars }}
        FAIL_ON_TRUNCATED: ${{ inputs.fail-on-truncated }}
        DIFF_EXCLUDES: ${{ inputs.diff-excludes }}
        DIFF_CONTEXT_LINES: ${{ inputs.diff-context-lines }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: python "${{ github.action_path }}/src/claude_review.py"
